version: '3.8'

services:
  prism:
    build: .
    container_name: prism-platform
    restart: unless-stopped
    ports:
      - "3300:3300"
    environment:
      - PORT=3300
      - NODE_ENV=production
      - PRISM_DB_PATH=/data/prism.db
    volumes:
      - prism-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3300/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  prism-data:
    driver: local
